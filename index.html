<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shadow Run</title>
  <link rel="stylesheet" href="style.css">
</head>
<body id="HOLDER">
  <script>

    const HOLDER = document.getElementById("HOLDER");
    
    // ─── Load Textures ────────────────────────────────────────────
    
    // ─── Texture Load Finish ──────────────────────────────────────

    let pageNum     = 1;
    let position    = 1;
    let homeRunning = true;
    let paused = false;

    const SCREEN = [{
      play: `
        <canvas id="screen" width="676" height="350"></canvas>
        <div id="controls">
          <button class="btn" id="btnLeft">←</button>
          <button class="btn" id="btnRight">→</button>
          <button class="btn" id="btnJump">↑</button>
        </div>
          <button id="backToScreen">&laquo;</button>
          <button id="nextLevel">Next Level ></button>
          <button id="restart">Restart</button>
          <button id="pauseBtn" onclick="togglePause()">&#9208;</button>
          <canvas id="inGameScreen" height="350" width="400"></canvas>
      `
    }];

    // ── Sounds ───────────────────────────────────────────────
    let audioCtx = null;

    function getAC() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioCtx;
    }

    function tone(freq, type, when, dur, vol, endFreq) {
      const ac   = getAC();
      const osc  = ac.createOscillator();
      const gain = ac.createGain();
      osc.connect(gain);
      gain.connect(ac.destination);
      osc.type = type || "square";
      osc.frequency.setValueAtTime(freq, when);
      if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, when + dur);
      gain.gain.setValueAtTime(vol || 0.18, when);
      gain.gain.exponentialRampToValueAtTime(0.001, when + dur);
      osc.start(when);
      osc.stop(when + dur);
    }

    function soundButtonClicked() {
      const t = getAC().currentTime;
      tone(880, "sine", t + 0.07, 0.2, 0.18);
    }

    function loadPlay(selectedLevel) {
      homeRunning = false;
      HOLDER.innerHTML = SCREEN[0].play;
      window.currentLevelNumber = selectedLevel || 1;
      callPlay();
      position = 2;
    }

    function terms() {
      const ScreenShow = document.getElementById("ScreenShow");
      const Cross      = document.getElementById("cross");
      const BTPB       = document.getElementById("BackPageBTN");
      ScreenShow.innerHTML = `
        <h1>Terms</h1>
        <div class="TermP">
          I made this game using HTML, CSS and JS.<br>
          This Game is made by ShadowGamers98.<br>
          <span style="color:blue;font-size:1rem;">Help</span><br>
          <span style="color:blue;font-size:1rem;">How To Play</span><br>
          <span style="color:blue;font-size:1rem;">About This Game</span>
        </div>
      `;
      Cross.style.display = "none";
      BTPB.style.display  = "block";
    }

    function PrivacyPolicy() {
      const ScreenShow = document.getElementById("ScreenShow");
      const Cross      = document.getElementById("cross");
      const BTPB       = document.getElementById("BackPageBTN");
      ScreenShow.innerHTML = `
        <h1>Privacy Policy</h1>
        <div class="TermP">
          This game does not collect any personal data.<br><br>
          All progress is saved locally on your device only.<br><br>
          This Game is rated for 3+ Ages.<br><br>
        </div>
      `;
      Cross.style.display = "none";
      BTPB.style.display  = "block";
    }
    
    function pauseTexts() {
  paused = !paused;
  document.getElementById("pauseBtn").innerHTML = paused ? "▶️" : "&#9208;";
    //                      ▶ play      ⏸ pause
    
}
     function pauseText() {
       
     }

    function settingFunction() {
      const ScreenShow = document.getElementById("ScreenShow");
      const Cross      = document.getElementById("cross");
      ScreenShow.innerHTML = `
        <h1>Setting</h1><br>
        <h2>Our
          <span style="color:blue;" onclick="terms()">Terms</span>
          and
          <span style="color:blue;" onclick="PrivacyPolicy()">Privacy Policy</span>
        </h2>
        <button id="callDelete" onclick="deleteData()"
          style="margin-top:20px;padding:8px 16px;background:#aa0000;color:white;border:none;border-radius:8px;font-size:16px;">
          Delete Data
        </button>
      `;
      ScreenShow.style.display = "block";
      Cross.style.display      = "block";
    }

    function deleteData() {
      localStorage.clear();
      alert("Data deleted!");
    }

    function settingFunctionOFF() {
      const ScreenShow = document.getElementById("ScreenShow");
      const Cross      = document.getElementById("cross");
      ScreenShow.innerHTML     = ``;
      ScreenShow.style.display = "none";
      Cross.style.display      = "none";
    }

    function settingFunctionBack() {
      const BTPB  = document.getElementById("BackPageBTN");
      const Cross = document.getElementById("cross");
      BTPB.style.display  = "none";
      Cross.style.display = "block";
      settingFunction();
    }

    const LevelPage1 = [{
      LevelPG1: `
        <canvas id="LevelScreen" class="canvasss" height="350" width="676"></canvas>
        <button id="backToHomeScreen" onclick="HOMESCREEN(), soundButtonClicked()">&laquo;</button>
        <div class="levelBtnHolder1">
          <button class="levelBtn" onclick="soundButtonClicked(), loadPlay(1)"  id="LVL1"></button>
          <button class="levelBtn" onclick="soundButtonClicked(), loadPlay(2)"  id="LVL2"></button>
          <button class="levelBtn" onclick="soundButtonClicked()"               id="LVL3"></button>
          <button class="levelBtn" onclick="soundButtonClicked()"               id="LVL4"></button>
          <button class="levelBtn" onclick="soundButtonClicked()"               id="LVL5"></button>
          <button class="levelBtn" onclick="soundButtonClicked()"               id="LVL6"></button>
          <button class="levelBtn" onclick="soundButtonClicked()"               id="LVL7"></button>
          <button class="levelBtn" onclick="soundButtonClicked()"               id="LVL8"></button>
          <button class="levelBtn" onclick="soundButtonClicked()"               id="LVL9"></button>
          <button class="levelBtn" onclick="soundButtonClicked()"               id="LVL10"></button>
          <button class="levelBtn" onclick="soundButtonClicked()"               id="LVL11"></button>
          <button class="levelBtn" onclick="soundButtonClicked()"               id="LVL12"></button>
          <button class="levelBtn" onclick="soundButtonClicked()"               id="LVL13"></button>
          <button class="levelBtn" onclick="soundButtonClicked()"               id="LVL14"></button>
          <button class="levelBtn" onclick="soundButtonClicked()"               id="LVL15"></button>
        </div>
      `
    }];

    // ── FIX 3: Stars — ★ ☆ use karo emoji nahi ─────────────
    function getStars(score) {
      if (score >= 300 ) return 3;
      if (score >= 200 ) return 2;
      if (score >= 100 ) return 1;
      return 0;
    }

    function saveLevelStars(levelNum, score) {
      const key      = "sr_stars_Level" + levelNum;
      const prev     = parseInt(localStorage.getItem(key) || "0");
      const newStars = getStars(score);
      if (newStars > prev) localStorage.setItem(key, newStars);
    }

    function getLevelStars(levelNum) {
      return parseInt(localStorage.getItem("sr_stars_Level" + levelNum) || "0");
    }

    // ── FIX 3: Star HTML — emoji nahi, unicode symbol ────────
    function starHTML(levelNum) {
      const s = getLevelStars(levelNum);
      let html = "";
      for (let j = 1; j <= 3; j++) {
        // ★ = filled (&#9733;)  ☆ = empty (&#9734;)
        // emoji nahi — pure unicode text symbol
        html += `<span style="color:${j <= s ? "#FFD700" : "#666777"};">&#9733;</span>`;
      }
      return html;
    }

    function page2() {
      if (pageNum !== 2) return;
      HOLDER.innerHTML = LevelPage1[0].LevelPG1;

      const canvas1 = document.getElementById("LevelScreen");
      const ctx1    = canvas1.getContext("2d");
      const W1      = canvas1.width;
      const H1      = canvas1.height;

      const sky = ctx1.createLinearGradient(0, 0, 0, H1);
      sky.addColorStop(0, "#060c28");
      sky.addColorStop(1, "#0a1a3f");
      ctx1.fillStyle = sky;
      ctx1.fillRect(0, 0, W1, H1);

      ctx1.fillStyle = "#ffffff55";
      for (let i = 0; i < 40; i++) {
        ctx1.fillRect((i * 137) % W1, (i * 71) % (H1 * 0.6), i % 3 === 0 ? 2 : 1, i % 3 === 0 ? 2 : 1);
      }

      ctx1.fillStyle = "#00f5ff";
      ctx1.font      = "bold 3.8rem monospace";
      ctx1.textAlign = "center";
      ctx1.fillText("LEVELS", W1 / 2, H1 / 2 - 115);

      // ── FIX 1+3: Saare 15 levels — lock + stars ek loop mein
      for (let i = 1; i <= 15; i++) {
        const btn = document.getElementById("LVL" + i);
        if (!btn) continue;

        // FIX 1: Level 1 hamesha unlocked
        //        Baki levels — pichle level ka score 300 se kam = LOCKED
        const isLocked = i > 1 &&
          parseInt(localStorage.getItem("sr_high_Level" + (i - 1)) || "0") < 300;

        if (isLocked) {
          // FIX 1: LOCKED — sab buttons pe laga
          btn.innerHTML        = `<div style="font-size:1.2rem;">&#128274;</div>`;
          btn.disabled         = true;
          btn.style.opacity    = "0.5";
          btn.style.cursor     = "not-allowed";
        } else {
          // FIX 3: UNLOCKED — number + stars (emoji nahi)
          btn.innerHTML = `
            <div class="LVLtext">${i}</div>
            <div class="star">${starHTML(i)}</div>
          `;
          btn.disabled      = false;
          btn.style.opacity = "1";
          btn.style.cursor  = "pointer";
        }
      }
    }

    function levelMenu() {
      pageNum = 2;
      page2();
    }

    function HOMESCREEN() {
      const HomeScreen = [{
        screen: `
          <canvas id="mainScreen" class="canvasss" height="350" width="676"></canvas>
          <button id="playButton" onclick="levelMenu(), soundButtonClicked()">Play</button>
          <button id="shopButton" onclick="soundButtonClicked()">Shop</button>
          <button id="settingButton" onclick="soundButtonClicked(), settingFunction()">Setting</button>
          <div id="coinOnHomeScreen" style="rotate:90deg; background:transparent;transform:translateY(-100px);"><img src="/Textures/materials/Coin.png" height="30px" alt="Coin Image"></img></div>
          <div id="ScreenShow"></div>
          <button id="cross" onclick="settingFunctionOFF(), soundButtonClicked()">&times;</button>
          <button id="BackPageBTN" onclick="settingFunctionBack(), soundButtonClicked()">&raquo;</button>
        `
      }];

      pageNum = 1;
      HOLDER.innerHTML = HomeScreen[0].screen;

      const canvas = document.getElementById("mainScreen");
      const ctx    = canvas.getContext("2d");
      const W      = canvas.width;
      const H      = canvas.height;

      function draw() {
        ctx.clearRect(0, 0, W, H);
        if (pageNum === 1) {
          const sky = ctx.createLinearGradient(0, 0, 0, H);
          sky.addColorStop(0, "#060c28");
          sky.addColorStop(1, "#0a1a3f");
          ctx.fillStyle = sky;
          ctx.fillRect(0, 0, W, H);
          ctx.fillStyle = "#ffffff55";
          for (let i = 0; i < 40; i++) {
            ctx.fillRect((i * 137) % W, (i * 71) % (H * 0.6), i % 3 === 0 ? 2 : 1, i % 3 === 0 ? 2 : 1);
          }
          ctx.fillStyle = "#00f5ff";
          ctx.font      = "bold 3.8rem monospace";
          ctx.textAlign = "center";
          ctx.fillText("SHADOW RUN", W / 2, H / 2 - 100);
        }
      }

      homeRunning = true;
      function loop() {
        if (!homeRunning) return;
        draw();
        requestAnimationFrame(loop);
      }
      loop();
    }

    HOMESCREEN();

  </script>
  <script src="Levels/level1.js"></script>
  <script src="Levels/level2.js"></script>
  <script src="image & sound.js"></script>
  <script src="main.js"></script>
</body>
</html>
